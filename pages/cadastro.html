<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro do Usuário</title>
    <link rel="stylesheet" href="../styles/cadastro.css" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap");
    </style>
  </head>

  <body>
    <main>
      <section>
        <div class="container_section">
          <div class="container_titulo">
            <div id="titulo">
              <h1>
                Crie sua conta no Conversaê, aqui você é ouvido sem julgamento!
              </h1>
            </div>
          </div>

          <div class="imagem">
            <img src="../images/cuate.png" id="img" />
            <img src="../images/forma imagem.png" id="rabisco" />
          </div>

          <div class="container_formulario">
            <div class="container_conta">
              <div class="escolha">
                <h1>Criar conta</h1>
                <p id="para">Escolha seu tipo de conta</p>

                <div class="botao_escolha">
                  <div id="psicologo">
                    <img src="../images/Frame 110.png" />
                    <p>Psicólogo</p>
                  </div>
                  <div id="paciente">
                    <img src="../images/Frame 111.png" />
                    <p>Paciente</p>
                  </div>
                </div>
                <div class="botao">
                  <button>Próximo</button>
                  <span id="conta"
                    >Já tem uma conta?
                    <a href="../pages/login.html" id="cadastro"
                      >Fazer login</a
                    ></span
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
