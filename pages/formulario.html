<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="../styles/formulario.css">

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap");
    </style>
</head>

<body>
    <body>
    <main>
      <section>
        <div class="container_section">

          <div class="container_titulo">

            <div id="titulo">
            <h1>Criando conta, você está quase lá</h1>
            </div>
            </div>

            <div id="img">
                <img src="../images/cuate1.png" id="imagem">
            </div>

            <div class="formulario">
                <input
                type="name"
                placeholder="Nome"
                id="nome"
                style="padding: 15px"
              />

                <input
                type="sobrenome"
                placeholder="Sobrenome"
                id="sobrenome"
                style="padding: 15px"
              />

              <input
                type="data"
                placeholder="Data de Nascimento"
                id="data"
                style="padding: 15px"
              />

               <input
                type="email"
                placeholder="E-mail"
                id="email"
                style="padding: 15px"
              />

              <input
                type="senha"
                placeholder="Senha"
                id="senha"
                style="padding: 15px"
              />

              
              <input
                type="confirma"
                placeholder="Confirmar senha"
                id="senha"
                style="padding: 15px"
              />
            </div>

            <div id="circulo">
                <img src="../images/Rectangle 30.png">
            </div>
             <p> Criando uma conta, você concorda com nosso <br>
                 Acordo de Usuário e nossa Política de Privacidade</p>
        </div>

            <!-- <div class="botao">
                <button id="cancelar">
                    Cancelar
                </button>
                <button id="proximo">
                    Próximo
                </button>
            </div> -->
      </section>
    </main>
  </body>
</html>
    

</body>
</html>
