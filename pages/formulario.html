<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
    <link rel="stylesheet" href="../styles/formulario.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,100..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap");
    </style>
  </head>

  <body>
    <main>
      <section>
        <div class="container_section">
          <div class="container_titulo">
            <div id="titulo">
              <h1>Criando conta, você está quase lá</h1>
            </div>
          </div>

          <div id="img">
            <img src="../images/cuate1.png" id="imagem" alt="Ilustração" />
          </div>

          <div class="formulario">
            <input
              type="text"
              placeholder="Nome"
              id="nome"
              style="padding: 15px"
            />
            <input
              type="text"
              placeholder="Sobrenome"
              id="sobrenome"
              style="padding: 15px"
            />

            <input
              type="date"
              placeholder="Data de Nascimento"
              id="data"
              style="padding: 15px"
            />
            <input
              type="email"
              placeholder="E-mail"
              id="email"
              style="padding: 15px"
            />
            <input
              type="password"
              placeholder="Senha"
              id="senha"
              style="padding: 15px"
            />
            <input
              type="password"
              placeholder="Confirmar senha"
              id="confirmar_senha"
              style="padding: 15px"
            />
          </div>

            <div id="circulo">
             <button id="bola"></button>
            </div>
            <p>
              Criando uma conta, você concorda com nosso <br />
              Acordo de Usuário e nossa Política de Privacidade
            </p>

            <div class="botoes">
              <button id="can">Cancelar</button>
              <button id="pro">Próximo</button>
            </div>

        </div>
      </section>
    </main>
  </body>
</html>
