<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../styles/login.css" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap");
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="container_section">
          <div class="container_titulo">
            <div id="titulo">
              <h1>Faça seu login no Conversaê e mantenha sua mente saudável</h1>
            </div>

            <div class="imagem">
              <img src="../images/amico.png" id="img" />
              <img src="../images/Vector 71.png" id="rabisco" />
            </div>
          </div>

          <div class="container_formulario">
            <div class="formulario">
              <h2>Endereço de e-mail</h2>
              <input
                type="e-mail"
                placeholder="Insira seu e-mail"
                id="email"
                style="padding: 15px"
              />
              <h2>Senha</h2>
              <input
                type="password"
                placeholder="Insira sua senha"
                id="senha"
                style="padding: 15px"
              />

              <div class="container1">
                <span id="conta"
                  ><a href="#" id="esqueceu"> Esqueceu a senha? </a>
                </span>
              </div>
              <div class="botao">
                <span id="conta"
                  >Não tem conta? <a href="../pages/cadastro.html" id="cadastro">Cadastre-se</a></span
                >
                <button>Enviar</button>
              </div>
            </div>
            <div class="redes_sociais">
              <img src="../images/Group.png" id="google" />
              <img src="../images/Vector-1.png" id="face" />
              <img src="../images/Vector.png" id="apple" />
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="container_footer">
        <div class="imagem_footer">
          <img src="../images/image 2.png" />
          <div class="texto_footer">
            <h2 id="convers">Convers<span id="ae">aê</span></h2>
            <h4 id="slogan">Mente em dia, vida em equílibrio.</h4>
          </div>
        </div>
        <h4 id="copy">Conversaê. © Copyright 2026. Todos os direitos reservados.</h4>
      </div>
    </footer>
  </body>
</html>
