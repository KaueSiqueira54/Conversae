<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finalizando</title>
    <link rel="stylesheet" href="../styles/finalizando.css" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap");
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="container_section">
          <div class="container_titulo">
            <div id="titulo">
              <h1>Queremos saber mais sobre você</h1>
            </div>

            <div class="formulario">
              <input
                type="text"
                placeholder="Sexualidade"
                id="sexualidade"
                style="padding: 15px"
              />
              <input
                type="text"
                placeholder="Hobbies"
                id="hobbies"
                style="padding: 15px"
              />

              <input
                type="text"
                placeholder="Estado civil"
                id="estado"
                style="padding: 15px"
              />
              <input
                type="text"
                placeholder="Estado em que reside"
                id="residencia"
                style="padding: 15px"
              />
            </div>

            <div id="imagem1">
              <img src="../images/pana.png" id="pincel" />
            </div>


            <div class="botoes">
              <button id="fin">Finalizar</button>
              <button id="can">Cancelar</button>
            </div>


          </div>
        </div>
      </section>
    </main>
  </body>
</html>
